set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
# Reopen Claude Code conversations after a restore (see ~/bin/tmux-claude-restore).
# Add --run to the restore line to press Enter instead of only typing the command.
set -g @resurrect-hook-post-save-all '/home/dev/bin/tmux-claude-restore save'
set -g @resurrect-hook-post-restore-all '/home/dev/bin/tmux-claude-restore restore'

set -g mouse on
set -g default-command "${SHELL}"
set -g default-terminal xterm-256color
set -g history-limit 50000
set -s set-clipboard on

# Wait 50ms before forwarding ESC key (instead of the default 500)
set -sg escape-time 50

# Report focus status to applications inside tmux
set -g focus-events on

# Give the session name more room in the status line (default is 10 columns)
set -g status-left-length 25

# High-visibility active-window indicator
set -g window-status-format ' #I:#W#F'
set -g window-status-current-format ' #I:#W#F'
set -g window-status-current-style 'bg=black,fg=gold,bold'

set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Create new windows with current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Start windows and panes at index 1, not 0
set -g base-index 1
setw -g pane-base-index 1

bind-key -T copy-mode-vi d send-keys -X halfpage-down
bind-key -T copy-mode-vi u send-keys -X halfpage-up
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Show panes under windows by default, in the Prefix + W menu.
bind-key w choose-tree -Z

# Kill guard: before killing a pane/window/session/server, check what is running
# in it and warn about ongoing work. The checks are in ~/bin/tmux-kill-guard.
# The short names (killp, killw, kill-ses, kill-ser) are not guarded.
set -s command-alias[100] kill-pane='set -gF @kg_ctx "#{session_id} #{window_id} #{pane_id}" ; display-popup -w 80% -h 50% -T " kill-pane " -E /home/dev/bin/tmux-kill-guard kill-pane'
set -s command-alias[101] kill-window='set -gF @kg_ctx "#{session_id} #{window_id} #{pane_id}" ; display-popup -w 80% -h 50% -T " kill-window " -E /home/dev/bin/tmux-kill-guard kill-window'
set -s command-alias[102] kill-session='set -gF @kg_ctx "#{session_id} #{window_id} #{pane_id}" ; display-popup -w 80% -h 50% -T " kill-session " -E /home/dev/bin/tmux-kill-guard kill-session'
set -s command-alias[103] kill-server='display-popup -w 80% -h 50% -T " kill-server " -E /home/dev/bin/tmux-kill-guard kill-server'
bind x run-shell -b "/home/dev/bin/tmux-kill-guard --key --client '#{client_name}' kill-pane -t '#{pane_id}'"
bind & run-shell -b "/home/dev/bin/tmux-kill-guard --key --client '#{client_name}' kill-window -t '#{session_id}:#{window_id}'"

# Keep this at the very bottom
run '~/.tmux/plugins/tpm/tpm'
